services:
  postgres:
    image: postgres:16-alpine
    container_name: flowboard-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowboard}
      POSTGRES_DB: ${POSTGRES_DB:-flowboard}
    volumes:
      - flowboard_postgres_data:/var/lib/postgresql/data

volumes:
  flowboard_postgres_data:
